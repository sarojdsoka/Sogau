backend = "fastresize"
palette = "salience"
color_space = "labmixed"
threshold = 11

[templates]
cava = { template = "colors-cava", target = "~/.config/cava/config" }
hypr = { template = "colors-hyprland.conf", target = "~/.config/hypr/wallust/wallust-hyprland.conf" }
rofi = { template = "colors-rofi.rasi", target = "~/.config/rofi/wallust/colors-rofi.rasi" }
waybar = { template = "colors-waybar.css", target = "~/.config/waybar/wallust/colors-waybar.css" }
kitty = { template = "colors-kitty.conf", target = "~/.config/kitty/kitty-themes/01-Wallust.conf" }
ghostty = { template = "colors-ghostty.conf", target = "~/.config/ghostty/wallust.conf" }
quickshell = { template = "qml_color.json", target = "~/.config/quickshell/qml_color.json" }
